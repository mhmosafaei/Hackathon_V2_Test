name: Deployment checks
on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'src/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'requirements-test.txt'
      - 'render.yaml'
      - 'scripts/start_render.sh'
      - '.github/workflows/deployment-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt -r requirements-test.txt httpx
      - run: python -m pytest -q tests/test_deployment_health.py
      - name: Run complete backend test suite
        run: python -m pytest -q --tb=short
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
